# QuizGenApp Configuration v2.0
# ─────────────────────────────────────────────────────────────────────────────
# All agents share a SINGLE model. Differentiation is via prompts only.
# ─────────────────────────────────────────────────────────────────────────────

[models]
# Primary model for ALL agents (Curator, Pedagogue, Adversary, Explainer)
# Preferred: qwen3:4b  |  Alternative: phi4-mini
model = qwen3:4b

# Legacy keys kept for backward compatibility (ignored by new pipeline)
curator_model = qwen3:4b
pedagogue_model = qwen3:4b
adversary_model = qwen3:4b
explainer_model = qwen3:4b

[extraction]
use_gpu = true
batch_multiplier = 2

[rag]
# Sentence-transformer model for embeddings
embedding_model = all-MiniLM-L6-v2

# Characters per chunk (target)
chunk_size = 512

# Overlap between consecutive chunks (characters)
chunk_overlap = 64

# Top-k chunks to retrieve per query
top_k = 8

# Candidate multiplier: generate N * candidate_multiplier questions
# Adversary selects the best N from the pool
# Higher = better quality, slower generation
candidate_multiplier = 2.0

[adversary]
# Minimum adversary score (0-100) to accept a question
# Questions below this threshold are rejected
acceptance_threshold = 60

[logging]
level = INFO

